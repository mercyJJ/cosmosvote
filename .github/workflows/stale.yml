name: Stale

on:
  schedule:
    # Run daily at 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e # v9.0.0
        with:
          # Issues: stale after 60 days, close 14 days later
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had any recent activity. It will be closed in 14 days if no further
            activity occurs. If this is still relevant, please comment or remove
            the stale label.
          close-issue-message: >
            This issue was automatically closed because it has been stale for 14
            days with no further activity. Feel free to reopen it if it is still
            relevant.

          # Pull requests: stale after 30 days, close 14 days later
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had any recent activity. It will be closed in 14 days if no
            further activity occurs. If this is still relevant, please comment or
            remove the stale label.
          close-pr-message: >
            This pull request was automatically closed because it has been stale
            for 14 days with no further activity. Feel free to reopen it if it is
            still relevant.

          # Labels exempt from stale marking
          exempt-issue-labels: 'wontfix,help wanted'
          exempt-pr-labels: 'wontfix,help wanted'

          # Do not mark items that are assigned or have a milestone
          exempt-all-assignees: false
          exempt-all-milestones: false

          # Limit operations per run to stay within API rate limits
          operations-per-run: 100