name: Enforce Branch Protection

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 06:00 UTC to verify protection is still configured
    - cron: '0 6 * * *'
  workflow_dispatch:

# Reading branch protection rules requires repository administration
# privileges. The default GITHUB_TOKEN usually cannot read protection
# settings on its own, so an admin-scoped PAT can be supplied via the
# BRANCH_PROTECTION_TOKEN secret. When that secret is absent the check
# falls back to GITHUB_TOKEN (works on some repository configurations).
permissions:
  contents: read

jobs:
  prevent-direct-push:
    name: Prevent direct push to main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check if commit is from a Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The GitHub API allows finding pull requests associated with a commit
          PR_COUNT=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.groot-preview+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq length)
          
          if [ -z "$PR_COUNT" ] || [ "$PR_COUNT" -eq 0 ]; then
            echo "ERROR: Direct push to main detected. All changes must be made via Pull Request."
            exit 1
          else
            echo "Success: Commit is associated with $PR_COUNT pull request(s)."
          fi

  validate-protection:
    name: Validate branch protection on main
    # Only meaningful when triggered on a schedule or manually — the
    # push event is handled by prevent-direct-push above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Use an admin-scoped PAT if provided, otherwise fall back to the
      # default GITHUB_TOKEN. Branch-protection reads need admin rights.
      GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
      # The branch that must carry protection rules.
      PROTECTED_BRANCH: main
      # Required status check context names that MUST be enforced on main.
      # These mirror the canonical CI jobs in .github/workflows/ci.yml.
      REQUIRED_STATUS_CHECKS: |-
        Formatting
        Clippy
        Tests
        Build WASM
        License Compliance
        actionlint
        Frontend Coverage
        Frontend (Node 20)
        Contracts (Rust stable)
    steps:
      - name: Fetch branch protection rules
        id: fetch
        run: |
          set -euo pipefail
          echo "Fetching protection rules for ${{ github.repository }}:$PROTECTED_BRANCH …"
          # 404 ⇒ no protection at all configured → fail below.
          if ! RESPONSE=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/branches/$PROTECTED_BRANCH/protection" 2>/dev/null); then
            echo "::error::No branch protection rules are configured on '$PROTECTED_BRANCH'. See docs/branch-config.md for the required settings."
            exit 1
          fi
          echo "$RESPONSE" > protection.json
          echo "Fetched protection configuration:"
          jq . protection.json

      - name: Validate required status checks
        run: |
          set -euo pipefail
          # required_status_checks may be null if not configured.
          CONTEXTS=$(jq -r '
            if .required_status_checks == null then "null"
            elif (.required_status_checks.contexts | length) > 0 then .required_status_checks.contexts | join("\n")
            else "empty"
            end' protection.json)

          if [ "$CONTEXTS" = "null" ]; then
            echo "::error::required_status_checks is NOT configured on '$PROTECTED_BRANCH'. At least the canonical CI checks must be required."
            exit 1
          fi

          echo "Configured required status checks:"
          echo "$CONTEXTS"
          echo ""

          MISSING=0
          while IFS= read -r required; do
            [ -z "$required" ] && continue
            if ! echo "$CONTEXTS" | grep -Fxq "$required"; then
              echo "::warning::Required status check '$required' is missing from branch protection."
              MISSING=$((MISSING + 1))
            else
              echo "✓ '$required' is enforced."
            fi
          done <<< "$REQUIRED_STATUS_CHECKS"

          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING required status check(s) are not enforced on '$PROTECTED_BRANCH'. Update branch protection to require them."
            exit 1
          fi
          echo "All required status checks are enforced."

      - name: Validate at least one required reviewer
        run: |
          set -euo pipefail
          REVIEWERS=$(jq -r '
            if .required_pull_request_reviews == null then "null"
            else .required_pull_request_reviews.required_approving_review_count
            end' protection.json)

          if [ "$REVIEWERS" = "null" ]; then
            echo "::error::required_pull_request_reviews is NOT configured on '$PROTECTED_BRANCH'. At least 1 approving review is required."
            exit 1
          fi

          if [ "$REVIEWERS" -lt 1 ] 2>/dev/null; then
            echo "::error::required_approving_review_count is $REVIEWERS on '$PROTECTED_BRANCH'. At least 1 reviewer is required."
            exit 1
          fi

          echo "✓ required_approving_review_count = $REVIEWERS (≥ 1)."

      - name: Summary
        if: always()
        run: |
          echo "## Branch Protection Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`$PROTECTED_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository:** ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f protection.json ]; then
            echo "### Required status checks" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.required_status_checks.contexts | if . == null then "- _none configured_"; else .[] | "- \(. )" end' protection.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Required approving reviews" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.required_pull_request_reviews.required_approving_review_count // "_not configured_"' protection.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No protection configuration was found._" >> "$GITHUB_STEP_SUMMARY"
          fi
