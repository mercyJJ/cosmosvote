[package]
name = "cosmosvote-governance"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "CosmosVote governance contract — on-chain proposals and token-weighted voting on Stellar Soroban"
repository = "https://github.com/mercyJJ/cosmosvote"
authors = ["mercyJJ <joymercy7879@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "delegation_vote_weight_tests"
path = "../../tests/delegation_vote_weight_tests.rs"

[[test]]
name = "governance_treasury_cross_contract_tests"
path = "../../tests/governance_treasury_cross_contract_tests.rs"

# Issue #114: this file previously existed but was never registered as a
# cargo test target, so it silently never ran in CI despite looking like
# normal test coverage. Registering it here is what makes `make
# test-integration` (and the new event-type / retry tests added for #114)
# actually execute.
[[test]]
name = "notification_integration_tests"
path = "../../tests/notification_integration_tests.rs"

[dependencies]
soroban-sdk = { version = "29.0.1" }

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
proptest = "1.6.0"
cosmosvote-token = { path = "../token", features = ["testutils"] }
cosmosvote-treasury = { path = "../treasury", features = ["testutils"] }
# Issue #113: reads/writes tests/baselines/perf_contract_execution.json
serde_json = "1.0"

[features]
testutils = ["soroban-sdk/testutils"]
