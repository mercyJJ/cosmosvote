[workspace]
resolver = "2"
members = [
    "contracts/governance",
    "contracts/token",
    "contracts/treasury",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"

# Note: serde_json dev-dependency for perf tests is declared in the
# individual crate Cargo.toml files that need it.
